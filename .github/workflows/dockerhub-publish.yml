name: Build and publish to GitHub Container Registry

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/radio-cafe-pdv-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/radio-cafe-pdv-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, for multi-arch builds)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Show published images
        run: |
          echo "Published frontend -> $FRONTEND_IMAGE:latest and $FRONTEND_IMAGE:${GITHUB_SHA}"
          echo "Published backend  -> $BACKEND_IMAGE:latest and $BACKEND_IMAGE:${GITHUB_SHA}"
